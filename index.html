<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mój Włoski</title>
<meta name="theme-color" content="#FBF6EE" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141A1B" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Włoski">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>:root{
  --bg:#FBF6EE; --card:#FFFFFF; --ink:#1E2A2C; --muted:#6E7a7a; --line:#ECE3D6;
  --accent:#C8553D; --accent-soft:#F6DED6; --green:#2F7A55; --green-soft:#DCEFE3;
  --gold:#D9962B; --gold-soft:#FAEBCF; --red:#C0392B; --red-soft:#F8DCD8; --blue:#2E6F9E; --blue-soft:#DCEAF5;
  --r:18px; --shadow:0 1px 2px rgba(30,42,44,.06),0 4px 16px rgba(30,42,44,.06);
  --serif: ui-serif, "New York", Georgia, serif;
  --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#141A1B; --card:#1E2627; --ink:#F1ECE4; --muted:#9AA6A5; --line:#2C3637;
    --accent:#E2735A; --accent-soft:#3A2420; --green:#5BBF8A; --green-soft:#1D3328; --gold:#E9B35A; --gold-soft:#3A2F1C;
    --red:#E9695B; --red-soft:#3D2220; --blue:#6FA9D6; --blue-soft:#1C2C39; --shadow:none; }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.4}
body{min-height:100dvh;-webkit-text-size-adjust:100%}
button,input,textarea,select{font:inherit;color:inherit}
#app{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 96px)}
h1,h2,h3{font-family:var(--serif);font-weight:700;margin:0}
h1{font-size:30px;letter-spacing:-.01em}
h2{font-size:22px;margin:22px 0 10px}
h3{font-size:18px}
p{margin:6px 0}
.muted{color:var(--muted)} .small{font-size:14px} .tiny{font-size:12px}
.row{display:flex;gap:10px;align-items:center} .between{justify-content:space-between} .wrap{flex-wrap:wrap}
.grow{flex:1} .center{text-align:center}
.card{background:var(--card);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);border:1px solid var(--line);margin:12px 0}
.btn{appearance:none;border:0;border-radius:14px;padding:14px 18px;font-weight:600;background:var(--line);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--accent);color:#fff}
.btn.green{background:var(--green);color:#fff}
.btn.ghost{background:transparent;border:1.5px solid var(--line)}
.btn.block{width:100%}
.btn.sm{min-height:36px;padding:8px 12px;font-size:15px;border-radius:11px}
.btn[disabled]{opacity:.45}
.icon-btn{appearance:none;border:0;background:var(--line);width:44px;height:44px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer;flex:none}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;background:var(--line);font-size:13px;font-weight:600}
.chip.green{background:var(--green-soft);color:var(--green)} .chip.gold{background:var(--gold-soft);color:var(--gold)}
.chip.red{background:var(--red-soft);color:var(--red)} .chip.blue{background:var(--blue-soft);color:var(--blue)}
.chip.accent{background:var(--accent-soft);color:var(--accent)}
input[type=text],input[type=number],input[type=time],textarea,select{width:100%;border:1.5px solid var(--line);background:var(--card);border-radius:14px;padding:13px 14px;outline:none}
input:focus,textarea:focus{border-color:var(--accent)}
textarea{min-height:120px;resize:vertical;font-size:15px}
label.lbl{display:block;font-size:14px;color:var(--muted);margin:12px 0 6px;font-weight:600}

/* Tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:20}
.tabbar .in{display:flex;max-width:560px;width:100%}
.tabbar button{flex:1;appearance:none;border:0;background:none;padding:9px 0 7px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--muted);cursor:pointer}
.tabbar button .i{font-size:22px;line-height:1;filter:grayscale(1);opacity:.75}
.tabbar button.on{color:var(--accent)} .tabbar button.on .i{filter:none;opacity:1}

/* Home */
.hero{display:flex;gap:16px;align-items:center}
.ring{width:108px;height:108px;flex:none;position:relative}
.ring svg{transform:rotate(-90deg)}
.ring .lab{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .lab b{font-size:26px;font-family:var(--serif)}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;text-align:center}
.stat b{display:block;font-size:22px;font-family:var(--serif)}
.stat span{font-size:12px;color:var(--muted);font-weight:600}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.quick button{appearance:none;border:1px solid var(--line);background:var(--card);border-radius:16px;padding:14px;text-align:left;cursor:pointer;box-shadow:var(--shadow)}
.quick button b{display:block;font-size:16px;margin-top:4px}
.quick button span{font-size:13px;color:var(--muted)}
.phrase{background:linear-gradient(135deg,var(--accent),#A8432F);color:#fff;border:0}
.phrase .it{font-family:var(--serif);font-size:21px;margin:6px 0}

/* Session */
.sess-top{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;flex:1}
.bar i{display:block;height:100%;background:var(--green);border-radius:99px;transition:width .4s}
.ex{min-height:58vh;display:flex;flex-direction:column}
.ex .kind{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.prompt{font-family:var(--serif);font-size:30px;line-height:1.2;margin:14px 0 6px;word-break:break-word}
.prompt.md{font-size:24px}
.sub{color:var(--muted);font-size:16px}
.reveal{margin-top:16px;padding:14px;border-radius:14px;background:var(--bg);border:1px dashed var(--line)}
.opts{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.opt{appearance:none;text-align:left;border:1.5px solid var(--line);background:var(--card);border-radius:14px;padding:14px 16px;font-size:18px;cursor:pointer}
.opt.ok{border-color:var(--green);background:var(--green-soft)} .opt.bad{border-color:var(--red);background:var(--red-soft)}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:auto;padding-top:16px}
.grades button{appearance:none;border:0;border-radius:12px;padding:10px 4px;font-weight:700;font-size:14px;cursor:pointer;line-height:1.15}
.grades button small{display:block;font-weight:500;font-size:11px;opacity:.8}
.g0{background:var(--red-soft);color:var(--red)} .g1{background:var(--gold-soft);color:var(--gold)}
.g2{background:var(--green-soft);color:var(--green)} .g3{background:var(--blue-soft);color:var(--blue)}
.answer{display:flex;gap:8px;margin-top:16px}
.answer input{font-size:19px}
.mic{width:56px;height:56px;border-radius:50%;border:0;background:var(--accent);color:#fff;font-size:24px;flex:none;cursor:pointer}
.mic.live{animation:pulse 1.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(200,85,61,.5)}70%{box-shadow:0 0 0 16px rgba(200,85,61,0)}100%{box-shadow:0 0 0 0 rgba(200,85,61,0)}}
.fb{margin-top:16px;padding:14px 16px;border-radius:14px}
.fb.ok{background:var(--green-soft)} .fb.bad{background:var(--red-soft)} .fb.mid{background:var(--gold-soft)}
.fb b.t{display:block;font-size:18px;margin-bottom:4px}
.w-ok{color:var(--green);font-weight:700} .w-bad{color:var(--red);font-weight:700;text-decoration:underline wavy}
.score{font-family:var(--serif);font-size:34px;font-weight:700}
.footer-actions{margin-top:auto;padding-top:18px;display:flex;flex-direction:column;gap:10px}
.tools{display:flex;gap:8px;justify-content:space-between;margin-top:14px}
.linkbtn{appearance:none;border:0;background:none;color:var(--muted);font-size:14px;font-weight:600;padding:6px 0;cursor:pointer}
.clock{display:block;margin:6px auto}
.hint{font-size:13px;color:var(--muted);margin-top:8px}

/* Library */
.topic{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}
.topic:last-child{border-bottom:0}
.topic .em{font-size:26px;width:40px;text-align:center}
.prog{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:6px;display:flex}
.prog i{display:block;height:100%}
.list-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.list-item:last-child{border-bottom:0}
.notes h2{font-size:18px;margin:12px 0 6px} .notes ul{padding-left:20px;margin:6px 0} .notes li{margin:3px 0}
.thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.thumbs img,.thumbs .pdf{width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px;background:var(--line);display:flex;align-items:center;justify-content:center;font-size:30px;cursor:pointer}
.seg{display:flex;background:var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;appearance:none;border:0;background:none;border-radius:9px;padding:8px;font-weight:600;font-size:14px;cursor:pointer}
.seg button.on{background:var(--card);box-shadow:var(--shadow)}
.toggle{position:relative;width:51px;height:31px;flex:none}
.toggle input{opacity:0;width:0;height:0}
.toggle span{position:absolute;inset:0;background:var(--line);border-radius:99px;transition:.2s;cursor:pointer}
.toggle span:before{content:"";position:absolute;width:27px;height:27px;left:2px;top:2px;background:#fff;border-radius:50%;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.toggle input:checked+span{background:var(--green)} .toggle input:checked+span:before{transform:translateX(20px)}

/* Stats */
.bars{display:flex;align-items:flex-end;gap:5px;height:120px;padding-top:8px}
.bars .b{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.bars .b i{display:block;width:100%;background:var(--accent);border-radius:6px 6px 2px 2px;min-height:2px}
.bars .b i.goal{background:var(--green)}
.bars .b span{font-size:10px;color:var(--muted)}
.kv{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)} .kv:last-child{border-bottom:0}

.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.modal .sheet{background:var(--bg);width:100%;max-width:560px;max-height:92dvh;overflow:auto;border-radius:22px 22px 0 0;padding:18px 16px calc(env(safe-area-inset-bottom) + 18px)}
.modal img{max-width:100%;border-radius:12px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 84px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:15px;z-index:60;max-width:90%}
.empty{padding:28px 10px;text-align:center;color:var(--muted)}
code,.code{font-family:ui-monospace,Menlo,monospace;font-size:13px;background:var(--line);padding:2px 5px;border-radius:6px}
pre.code{white-space:pre-wrap;padding:10px;display:block;max-height:220px;overflow:auto}
</style>
</head>
<body>
<main id="app"></main>
<nav class="tabbar" id="tabbar"><div class="in">
  <button data-t="home"><span class="i">🏠</span>Dziś</button>
  <button data-t="library"><span class="i">📚</span>Biblioteka</button>
  <button data-t="add"><span class="i">➕</span>Dodaj</button>
  <button data-t="stats"><span class="i">📈</span>Postępy</button>
</div></nav>
<script>// Wbudowany pakiet startowy A0 — z Twoich PDF-ów (Essere/Avere, Numeri, Orari, załącznik nr 1)
// oraz z rozdziałów 1–5 podręcznika "Facile Facile A0".
// Typy kart: w = słówko, c = luka, ch = wybór, qa = pytanie do mówienia, say = powtórz na głos
const W = (pairs) => pairs.map(([it, pl]) => ({ type: 'w', it, pl }));

const BUILTIN_PACK = {
  pack: 'start-a0',
  version: 1,
  title: 'Start A0',
  topics: [
    {
      id: 'saluti', name: 'Powitania i przedstawianie się', emoji: '👋', lesson: 'Facile Facile · Unità 1',
      notes: `## Saluti
- **ciao** – cześć (na powitanie i pożegnanie, nieformalnie)
- **buongiorno** – rano i w dzień · **buonasera** – od popołudnia
- **scusi** (formalnie, do Pan/Pani) · **scusa** (do Ty)
- **Mi chiamo…** = Nazywam się… · **Io sono…** = Ja jestem…`,
      cards: W([
        ['ciao', 'cześć'], ['buongiorno', 'dzień dobry'], ['buonasera', 'dobry wieczór'],
        ['buonanotte', 'dobranoc'], ['arrivederci', 'do widzenia'], ['a presto', 'do zobaczenia wkrótce'],
        ['a domani', 'do jutra'], ['grazie', 'dziękuję'], ['grazie mille', 'bardzo dziękuję'],
        ['prego', 'proszę (w odpowiedzi na dziękuję)'], ['per favore', 'proszę (prośba)'],
        ['scusi', 'przepraszam (formalnie)'], ['scusa', 'przepraszam (do kolegi)'],
        ['sì', 'tak'], ['no', 'nie'], ['come stai?', 'jak się masz?'], ['sto bene', 'mam się dobrze'],
        ['come ti chiami?', 'jak masz na imię?'], ['mi chiamo Damian', 'nazywam się Damian'],
        ['piacere', 'miło mi'], ['lo studente', 'student'], ['la studentessa', 'studentka'],
        ['l\'insegnante', 'nauczyciel / nauczycielka'],
      ]).concat([
        { type: 'say', it: 'Buongiorno, mi chiamo Damian. Piacere!', pl: 'Dzień dobry, nazywam się Damian. Miło mi!' },
        { type: 'say', it: 'Ciao, come stai? Sto bene, grazie.', pl: 'Cześć, jak się masz? Dobrze, dziękuję.' },
        { type: 'c', c: 'Ciao, come ___ chiami?', a: 'ti', pl: 'Cześć, jak masz na imię?' },
        { type: 'c', c: 'Buongiorno, io ___ Luca.', a: 'sono', pl: 'Dzień dobry, jestem Luca.', h: 'essere' },
      ]),
    },
    {
      id: 'fonetica', name: 'Wymowa: C, G, GLI, GN, SC', emoji: '👄', lesson: 'Facile Facile · Fonetica',
      notes: `## Twarde i miękkie
- **C + e/i** = „cz”: ciao, cena, cinema · **C + a/o/u** = „k”: casa, come, cucina
- **CH + e/i** = „k”: che, chi, chiesa
- **G + e/i** = „dż”: gelato, giorno · **G + a/o/u** = „g”: gatto · **GH** = „g”: spaghetti
- **GLI** ≈ „li” (miękkie): famiglia, figlio · **GN** ≈ „ń”: bagno, signora
- **SC + e/i** = „sz”: pesce, sci · **SC + a/o/u** = „sk”: scuola · **SCH** = „sk”: schiena`,
      cards: [
        ['ciao', 'cześć'], ['cena', 'kolacja'], ['cinema', 'kino'], ['casa', 'dom'], ['chiesa', 'kościół'],
        ['che cosa?', 'co?'], ['cucina', 'kuchnia'], ['gelato', 'lody'], ['giorno', 'dzień'], ['gatto', 'kot'],
        ['spaghetti', 'spaghetti'], ['ghiaccio', 'lód'], ['famiglia', 'rodzina'], ['figlio', 'syn'],
        ['bagno', 'łazienka'], ['signora', 'pani'], ['pesce', 'ryba'], ['scuola', 'szkoła'], ['sci', 'narty'],
        ['schiena', 'plecy'], ['lasagne', 'lasagne'], ['gnocchi', 'gnocchi'],
      ].map(([it, pl]) => ({ type: 'say', it, pl })),
    },
    {
      id: 'numeri', name: 'Liczby', emoji: '🔢', lesson: 'Numeri.pdf · Unità 1–3',
      notes: `## Jak budować liczby
- dziesiątka + jedności: 20 + 5 = **venticinque**, 40 + 7 = **quarantasette**
- przed **uno** i **otto** dziesiątka traci samogłoskę: **ventuno** (21), **trentotto** (38), **sessantuno** (61)
- 3 na końcu ma akcent: **ventitré**, trentatré
- setki: **cento**, duecento, trecento… (cento się nie zmienia!) → 154 = centocinquantaquattro
- tysiące: **mille**, ale 2000 = **duemila** (mille → **mila**)
- 1 000 000 = un milione · 2 000 000 = due milioni
- **uno** zmienia formę w rodzaju żeńskim: **una** casa
## Liczebniki porządkowe
primo, secondo, terzo, quarto, quinto, sesto, settimo, ottavo, nono, decimo, potem -**esimo**: undicesimo, dodicesimo…`,
      cards: W([
        ['zero', '0'], ['uno', '1'], ['due', '2'], ['tre', '3'], ['quattro', '4'], ['cinque', '5'], ['sei', '6'],
        ['sette', '7'], ['otto', '8'], ['nove', '9'], ['dieci', '10'], ['undici', '11'], ['dodici', '12'],
        ['tredici', '13'], ['quattordici', '14'], ['quindici', '15'], ['sedici', '16'], ['diciassette', '17'],
        ['diciotto', '18'], ['diciannove', '19'], ['venti', '20'], ['ventuno', '21'], ['ventotto', '28'],
        ['trenta', '30'], ['quaranta', '40'], ['cinquanta', '50'], ['sessanta', '60'], ['settanta', '70'],
        ['ottanta', '80'], ['novanta', '90'], ['cento', '100'], ['mille', '1000'], ['duemila', '2000'],
        ['un milione', '1 000 000'], ['primo', 'pierwszy'], ['secondo', 'drugi'], ['terzo', 'trzeci'],
        ['quarto', 'czwarty'], ['quinto', 'piąty'], ['decimo', 'dziesiąty'],
      ]).concat([
        { type: 'ch', q: 'Która liczba zmienia formę w rodzaju żeńskim?', o: ['due', 'tre', 'uno', 'cinque'], a: 2 },
        { type: 'ch', q: 'Jak poprawnie zapisać 17?', o: ['diciassette', 'diecisette', 'dici-sette', 'dieci-sette'], a: 0 },
        { type: 'ch', q: 'Jak poprawnie powiedzieć godzinę 13:00?', o: ['tredici', 'le tredici', 'tredici ore', 'il tredici'], a: 1 },
        { type: 'ch', q: 'Który liczebnik porządkowy ma nieregularną formę?', o: ['quinto', 'settimo', 'primo', 'nono'], a: 2 },
        { type: 'ch', q: 'W którym wyrażeniu „mille” zmienia się w „mila”?', o: ['mille euro', 'duemila', 'il mille', 'mille grazie'], a: 1 },
        { type: 'ch', q: '„Cento” przyjmuje liczbę mnogą, gdy stoją przed nim inne liczby (np. duecenti).', o: ['prawda', 'fałsz'], a: 1 },
        { type: 'c', c: '88 = ___', a: 'ottantotto', pl: 'Napisz słownie 88' },
        { type: 'c', c: '38 = ___', a: 'trentotto', pl: 'Napisz słownie 38' },
        { type: 'c', c: '61 = ___', a: 'sessantuno', pl: 'Napisz słownie 61' },
        { type: 'c', c: '325 = ___', a: 'trecentoventicinque', pl: 'Napisz słownie 325' },
      ]),
    },
    {
      id: 'tempo', name: 'Dni tygodnia i miesiące', emoji: '📅', lesson: 'Facile Facile · Unità 1 i 3',
      notes: `## Giorni della settimana
lunedì, martedì, mercoledì, giovedì, venerdì, sabato, domenica — piszemy małą literą!
- **oggi** dziś · **ieri** wczoraj · **domani** jutro
## Mesi
gennaio, febbraio, marzo, aprile, maggio, giugno, luglio, agosto, settembre, ottobre, novembre, dicembre`,
      cards: W([
        ['lunedì', 'poniedziałek'], ['martedì', 'wtorek'], ['mercoledì', 'środa'], ['giovedì', 'czwartek'],
        ['venerdì', 'piątek'], ['sabato', 'sobota'], ['domenica', 'niedziela'], ['oggi', 'dzisiaj'],
        ['ieri', 'wczoraj'], ['domani', 'jutro'], ['la settimana', 'tydzień'], ['il mese', 'miesiąc'],
        ['l\'anno', 'rok'], ['gennaio', 'styczeń'], ['febbraio', 'luty'], ['marzo', 'marzec'], ['aprile', 'kwiecień'],
        ['maggio', 'maj'], ['giugno', 'czerwiec'], ['luglio', 'lipiec'], ['agosto', 'sierpień'],
        ['settembre', 'wrzesień'], ['ottobre', 'październik'], ['novembre', 'listopad'], ['dicembre', 'grudzień'],
      ]).concat([
        { type: 'c', c: 'Oggi è lunedì, domani è ___.', a: 'martedì', pl: 'Dziś jest poniedziałek, jutro jest wtorek.' },
        { type: 'c', c: 'Ieri era sabato, oggi è ___.', a: 'domenica', pl: 'Wczoraj była sobota, dziś jest niedziela.' },
        { type: 'say', it: 'Oggi è lunedì, domani è martedì.', pl: 'Dziś jest poniedziałek, jutro wtorek.' },
      ]),

<script>/* Mój Włoski — aplikacja do codziennej nauki włoskiego (PWA, offline, bez serwera) */
'use strict';

// ---------- helpers ----------
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const shuffle = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pick = (a) => a[Math.floor(Math.random() * a.length)];
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const today = () => { const d = new Date(); return Math.floor(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / 864e5); };
const dayKey = (n = today()) => new Date(n * 864e5).toISOString().slice(0, 10);
const fmtDay = (n) => { const d = new Date(n * 864e5); return `${d.getUTCDate()}.${String(d.getUTCMonth() + 1).padStart(2, '0')}`; };
const weekKey = (n = today()) => { const dow = (new Date(n * 864e5).getUTCDay() + 6) % 7; return dayKey(n - dow); };
const uid = () => Math.random().toString(36).slice(2, 9);

function toast(msg, ms = 2200) {
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), ms);
}

// ---------- Italian numbers & time ----------
const U = ['zero', 'uno', 'due', 'tre', 'quattro', 'cinque', 'sei', 'sette', 'otto', 'nove', 'dieci', 'undici', 'dodici', 'tredici', 'quattordici', 'quindici', 'sedici', 'diciassette', 'diciotto', 'diciannove'];
const T = ['', '', 'venti', 'trenta', 'quaranta', 'cinquanta', 'sessanta', 'settanta', 'ottanta', 'novanta'];
function numRaw(n) {
  if (n < 20) return U[n];
  if (n < 100) { const d = Math.floor(n / 10), r = n % 10; let w = T[d]; if (r === 1 || r === 8) w = w.slice(0, -1); return r ? w + U[r] : w; }
  if (n < 1000) { const h = Math.floor(n / 100), r = n % 100; let w = h === 1 ? 'cento' : U[h] + 'cento'; if (!r) return w; if (Math.floor(r / 10) === 8) w = w.slice(0, -1); return w + numRaw(r); }
  if (n < 1e6) { const k = Math.floor(n / 1000), r = n % 1000; const w = k === 1 ? 'mille' : numRaw(k) + 'mila'; return r ? w + numRaw(r) : w; }
  const m = Math.floor(n / 1e6), r = n % 1e6; const w = m === 1 ? 'un milione' : numRaw(m) + ' milioni'; return r ? w + ' ' + numRaw(r) : w;
}
function numIt(n) { n = Math.floor(Math.abs(n)); let w = numRaw(n); if (n > 20 && n % 10 === 3 && n % 100 !== 13) w = w.replace(/tre$/, 'tré'); return w; }

function hourBases(h) {
  h = ((h % 24) + 24) % 24; const out = [];
  if (h === 0) out.push('è mezzanotte');
  else if (h === 12) out.push('è mezzogiorno', 'sono le dodici');
  else {
    const x = h % 12; out.push(x === 1 ? "è l'una" : 'sono le ' + numIt(x));
    if (h > 12) out.push(h === 13 ? 'sono le tredici' : 'sono le ' + numIt(h));
  }
  return out;
}
function timeForms(h, m) {
  const forms = [];
  if (m === 0) return hourBases(h);
  const after = m === 15 ? ['e un quarto', 'e quindici'] : m === 30 ? ['e mezza', 'e mezzo', 'e trenta'] : m === 45 ? ['e quarantacinque', 'e tre quarti'] : ['e ' + numIt(m)];
  hourBases(h).forEach((b) => after.forEach((a) => forms.push(b + ' ' + a)));
  if (m > 30) {
    const before = m === 45 ? ['meno un quarto', 'meno quindici'] : ['meno ' + numIt(60 - m)];
    hourBases(h + 1).forEach((b) => before.forEach((a) => forms.push(b + ' ' + a)));
  }
  return forms;
}
const pad2 = (n) => String(n).padStart(2, '0');

// ---------- text comparison ----------
function norm(s) {
  s = String(s || '').toLowerCase().replace(/[’`´‘]/g, "'");
  s = s.replace(/(\d{1,2})[:.](\d{2})/g, (_, a, b) => `${a} e ${+b}`);
  s = s.replace(/\d+/g, (d) => numIt(+d));
  s = s.normalize('NFD').replace(/[̀-ͯ]/g, '');
  return s.replace(/'/g, ' ').replace(/[^a-z0-9 ]/g, ' ').replace(/\s+/g, ' ').trim();
}
function lev(a, b) {
  if (a === b) return 0; if (!a.length) return b.length; if (!b.length) return a.length;
  let prev = Array.from({ length: b.length + 1 }, (_, i) => i);
  for (let i = 1; i <= a.length; i++) {
    const cur = [i];
    for (let j = 1; j <= b.length; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    prev = cur;
  }
  return prev[b.length];
}
const sim = (a, b) => { a = norm(a); b = norm(b); return 1 - lev(a, b) / Math.max(a.length, b.length, 1); };
const ART = /^(il|lo|la|l'|i|gli|le|un|una|uno|un')\s*/i;
function variants(target) {
  const out = [];
  String(target).split('/').map((x) => x.trim()).filter(Boolean).forEach((t) => {
    const clean = t.replace(/\s*[(\[].*?[)\]]\s*/g, ' ').replace(/[?!.…]+$/g, '').trim();
    out.push({ t: clean, art: false });
    if (ART.test(clean)) out.push({ t: clean.replace(ART, ''), art: true });
  });
  return out;
}
function evaluate(answer, targets, speech = false) {
  let best = { score: 0, t: targets[0], art: false };
  for (const tg of targets) for (const v of variants(tg)) {
    const s = sim(answer, v.t);
    if (s > best.score || (s === best.score && !v.art && best.art)) best = { score: s, t: v.art ? tg : v.t, art: v.art, full: tg };
  }
  const okTh = speech ? 0.8 : 0.999, midTh = speech ? 0.6 : 0.84;
  best.level = best.score >= okTh ? 'ok' : best.score >= midTh ? 'mid' : 'bad';
  if (best.level === 'ok' && best.art) best.note = 'Pamiętaj o rodzajniku: ' + best.full;
  else if (best.level === 'ok' && !speech && /[àèéìòù]/i.test(best.t) && !/[àèéìòù]/i.test(answer)) best.note = 'Uwaga na akcent: ' + best.t;
  return best;
}
function wordDiff(heard, target) {
  const h = new Set(norm(heard).split(' '));
  return String(target).split(/(\s+)/).map((w) => {
    if (!w.trim()) return w; const n = norm(w); if (!n) return esc(w);
    return `<span class="${h.has(n) ? 'w-ok' : 'w-bad'}">${esc(w)}</span>`;
  }).join('');
}

// ---------- storage ----------
const KEY = 'mojwloski_v1';
let S;
function defaults() {
  return {
    v: 1, created: today(), cards: {}, topics: {}, order: [], packs: {}, days: {}, journal: {},
    skills: { time: { n: 0, ok: 0 }, num: { n: 0, ok: 0, lvl: 1 } },
    settings: { name: 'Damian', goal: 20, newPerDay: 15, remind: '20:00', rate: 0.9, voice: '', speech: 'auto', genTime: true, genNum: true, weekGoal: 5 },
    onboarded: false,
  };
}
function load() {
  try { S = JSON.parse(localStorage.getItem(KEY)); } catch (e) { S = null; }
  if (!S || !S.cards) S = defaults();
  const d = defaults(); S.settings = Object.assign(d.settings, S.settings); S.skills = Object.assign(d.skills, S.skills);
  S.journal = S.journal || {}; S.days = S.days || {};
  importPack(BUILTIN_PACK, { silent: true });
}
let saveTimer;
function save(now) {
  clearTimeout(saveTimer);
  const doSave = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { toast('Nie udało się zapisać danych (pamięć pełna?)'); } };
  if (now) doSave(); else saveTimer = setTimeout(doSave, 400);
}
function dayStat(n = today()) {
  const k = dayKey(n);
  return S.days[k] || (S.days[k] = { sec: 0, n: 0, ok: 0, nw: 0, sp: 0, spn: 0 });
}
const peekDay = (n) => S.days[dayKey(n)] || { sec: 0, n: 0, ok: 0, nw: 0, sp: 0, spn: 0 };

// ---------- packs ----------
const VALID = { w: 1, c: 1, ch: 1, qa: 1, say: 1 };
function importPack(pack, { silent } = {}) {
  if (!pack || !Array.isArray(pack.topics)) throw new Error('Brak listy "topics" w pakiecie.');
  const pid = String(pack.pack || 'pakiet-' + uid()).replace(/[^\w-]/g, '-');
  const ver = pack.version || 1;
  if (silent && S.packs[pid] >= ver) return 0;
  let added = 0;
  pack.topics.forEach((tp, ti) => {
    const tid = String(tp.id || pid + '-' + ti).replace(/[^\w-]/g, '-');
    const ex = S.topics[tid];
    S.topics[tid] = Object.assign(ex || { id: tid, mastered: false, created: today(), src: pid }, {
      name: tp.name || ex?.name || 'Temat', emoji: tp.emoji || ex?.emoji || '📘', notes: tp.notes ?? ex?.notes ?? '', lesson: tp.lesson ?? ex?.lesson ?? '',
    });
    if (!S.order.includes(tid)) S.order.push(tid);
    (tp.cards || []).forEach((c, ci) => {
      if (!VALID[c.type]) return;
      const id = c.id ? `${tid}:${c.id}` : `${pid}:${tid}:${ci}`;
      const old = S.cards[id];
      const data = Object.assign({}, c); delete data.id;
      S.cards[id] = Object.assign({ id, t: tid, done: false, s: { due: 0, iv: 0, ef: 2.5, r: 0, l: 0, seen: 0, ok: 0, last: null } }, old || {}, data, { id, t: tid });
      if (!old) added++;
    });
  });
  S.packs[pid] = ver; save();
  return added;
}

// ---------- SRS (Anki-like) ----------
function schedule(card, g) {
  const s = card.s, t = today();
  s.seen++; s.last = t; if (g > 0) s.ok++;
  if (g === 0) { s.l++; s.ef = Math.max(1.3, s.ef - 0.2); s.iv = 0; s.due = t + 1; s.r = Math.max(0, s.r - 1); }
  else {
    if (s.iv === 0) s.iv = s.l > 0 && g >= 2 ? 2 : [0, 1, 1, 3][g];
    else s.iv = Math.max(s.iv + 1, Math.round(s.iv * (g === 1 ? 1.2 : g === 2 ? s.ef : s.ef * 1.3)));
    if (g === 1) s.ef = Math.max(1.3, s.ef - 0.15); if (g === 3) s.ef += 0.15;
    s.r++; s.due = t + s.iv;
  }
}
const isNew = (c) => c.s.seen === 0;
const active = (c) => !c.done && S.topics[c.t] && !S.topics[c.t].mastered;
const allCards = () => Object.values(S.cards);
function counts() {
  const t = today(), cs = allCards().filter(active);
  const due = cs.filter((c) => !isNew(c) && c.s.due <= t).length;
  const nw = cs.filter(isNew).length;
  const left = Math.max(0, S.settings.newPerDay - dayStat().nw);
  return { due, nw, newToday: Math.min(nw, left) };
}
function cardStatus(c) {
  if (c.done || S.topics[c.t]?.mastered) return 'mastered';
  if (isNew(c)) return 'new';
  if (c.s.iv >= 21) return 'mature';
  return 'learning';
}

// ---------- speech: TTS ----------
let voices = [];
function loadVoices() { try { voices = speechSynthesis.getVoices().filter((v) => /^it/i.test(v.lang)); } catch (e) { voices = []; } }
if ('speechSynthesis' in window) { loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }
function speak(text, slow) {
  if (!('speechSynthesis' in window)) { toast('Ta przeglądarka nie czyta tekstu na głos'); return; }
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(String(text).replace(/_{2,}/g, '…').replace(/\s*\/\s*/g, ', '));
    u.lang = 'it-IT';
    const v = voices.find((x) => x.name === S.settings.voice) || voices.find((x) => /enhanced|premium|alice|federica/i.test(x.name)) || voices[0];
    if (v) u.voice = v;
    u.rate = slow ? 0.6 : S.settings.rate;
    speechSynthesis.speak(u);
  } catch (e) {}
}

// ---------- speech: recognition ----------
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let srBroken = false;
const canListen = () => !!SR && S.settings.speech !== 'dictation' && !srBroken;
let currentRec = null;
function listen(onInterim) {
  return new Promise((resolve, reject) => {
    try {
      const rec = new SR(); currentRec = rec;
      rec.lang = 'it-IT'; rec.interimResults = true; rec.maxAlternatives = 5; rec.continuous = false;
      let finals = [];
      rec.onresult = (e) => {
        const res = e.results[e.results.length - 1];
        if (res.isFinal) { finals = [...res].map((a) => a.transcript); }
        else onInterim && onInterim(res[0].transcript);
      };
      rec.onerror = (e) => { currentRec = null; if (/not-allowed|service-not-allowed|audio-capture/.test(e.error)) { srBroken = true; reject(new Error('blocked')); } else reject(new Error(e.error)); };
      rec.onend = () => { currentRec = null; resolve(finals); };
      rec.start();
    } catch (e) { srBroken = true; reject(e); }
  });
}

// ---------- IndexedDB for photos / PDFs ----------
const idb = {
  db: null,
  open() {
    if (this.db) return Promise.resolve(this.db);
    return new Promise((res, rej) => {
      try {
        const r = indexedDB.open('mojwloski', 1);
        r.onupgradeneeded = () => r.result.createObjectStore('files', { keyPath: 'id' });
        r.onsuccess = () => { this.db = r.result; res(this.db); }; r.onerror = () => rej(r.error);
      } catch (e) { rej(e); }
    });
  },
  async tx(mode, fn) { const db = await this.open(); return new Promise((res, rej) => { const t = db.transaction('files', mode); const st = t.objectStore('files'); const out = fn(st); t.oncomplete = () => res(out && out.result !== undefined ? out.result : out); t.onerror = () => rej(t.error); }); },
  put(o) { return this.tx('readwrite', (s) => s.put(o)); },
  del(id) { return this.tx('readwrite', (s) => s.delete(id)); },
  async byTopic(tid) { const all = await this.tx('readonly', (s) => s.getAll()); return (all || []).filter((f) => f.topic === tid).sort((a, b) => a.at - b.at); },
};
function shrinkImage(file) {
  return new Promise((res) => {
    const url = URL.createObjectURL(file); const img = new Image();
    img.onload = () => {
      const k = Math.min(1, 1600 / Math.max(img.width, img.height)); const c = document.createElement('canvas');
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      c.toBlob((b) => { URL.revokeObjectURL(url); res(b || file); }, 'image/jpeg', 0.78);
    };
    img.onerror = () => res(file); img.src = url;
  });
}
async function addFiles(tid, files) {
  let n = 0;
  for (const f of files) {
    const blob = f.type.startsWith('image/') ? await shrinkImage(f) : f;
    try { await idb.put({ id: uid(), topic: tid, name: f.name, type: f.type || blob.type, blob, at: Date.now() }); n++; } catch (e) { toast('Nie udało się zapisać pliku'); }
  }
  return n;
}

// ---------- time tracking ----------
let lastAct = Date.now(), inSession = false;
['pointerdown', 'keydown', 'input'].forEach((e) => document.addEventListener(e, () => { lastAct = Date.now(); }, { passive: true }));
setInterval(() => {
  if (inSession && document.visibilityState === 'visible' && Date.now() - lastAct < 90000) {

    const lb = $('#sessmin'); if (lb) lb.textContent = Math.floor(dayStat().sec / 60) + '/' + S.settings.goal + ' min';
  }
}, 1000);

  let n = 0, d = today(); const goal = S.settings.goal * 60;
  if (peekDay(d).sec < goal) d--;
  while (peekDay(d).sec >= goal) { n++; d--; }
  return n;
}

// ---------- router ----------
let tab = 'home';
const app = () => $('#app');

  const views = { home: viewHome, library: viewLibrary, add: viewAdd, stats: viewStats, session: viewSession, topic: viewTopic, settings: viewSettings };
  (views[tab] || viewHome)();

  $$('#tabbar button').forEach((b) => b.classList.toggle('on', b.dataset.t === tab || (tab === 'topic' && b.dataset.t === 'library') || (tab === 'settings' && b.dataset.t === 'home')));
}

// ---------- HOME ----------
function ring(pct, label, sub) {
  const r = 46, c = 2 * Math.PI * r, off = c * (1 - clamp(pct, 0, 1));
  return `<div class="ring"><svg width="108" height="108"><circle cx="54" cy="54" r="${r}" fill="none" stroke="var(--line)" stroke-width="10"/>
  <circle cx="54" cy="54" r="${r}" fill="none" stroke="${pct >= 1 ? 'var(--green)' : 'var(--accent)'}" stroke-width="10" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${off}"/></svg>
  <div class="lab"><b>${label}</b><span class="tiny muted">${sub}</span></div></div>`;
}
function greeting() { const h = new Date().getHours(); return h < 5 ? 'Buonanotte' : h < 13 ? 'Buongiorno' : h < 18 ? 'Buon pomeriggio' : 'Buonasera'; }
function viewHome() {
  const ds = dayStat(), mins = Math.floor(ds.sec / 60), goal = S.settings.goal, c = counts(), st = streak();
  const acc = ds.n ? Math.round(ds.ok / ds.n * 100) : null;
  const say = allCards().filter((x) => x.type === 'say' && x.it.includes(' '));
  const ph = say.length ? say[today() % say.length] : null;
  const lastTopic = S.order.slice().reverse().map((id) => S.topics[id]).find((t) => t && t.src !== 'start-a0') || null;
  app().innerHTML = `
  <div class="row between"><div><div class="muted small">${new Date().toLocaleDateString('pl-PL', { weekday: 'long', day: 'numeric', month: 'long' })}</div>
  <h1>${greeting()}${S.settings.name ? ', ' + esc(S.settings.name) : ''}!</h1></div>
  <button class="icon-btn" id="gear" aria-label="Ustawienia">⚙️</button></div>
  ${!S.onboarded ? `<div class="card" style="border-color:var(--accent)"><h3>Pierwsze kroki 🇮🇹</h3>
    <p class="small">1. <b>Safari → Udostępnij → „Do ekranu początkowego”</b> – aplikacja będzie działać offline jak zwykła apka.<br>
    2. <b>Ustawienia iPhone → Ogólne → Klawiatura → Klawiatury → dodaj „Włoski”</b>, żeby dyktowanie rozumiało włoski.<br>
    3. Ustaw wieczorne przypomnienie: ⚙️ → <b>Przypomnienie</b>.</p>
    <button class="btn sm" id="onbOk">Gotowe, nie pokazuj</button></div>` : ''}

// ---------- SESSION ----------
let Q = null; // session
function buildQueue(opts) {
  const t = today(), cs = allCards().filter(active);
  let items = [];
  const gen = (k, n) => Array.from({ length: n }, () => ({ gen: k }));
  if (opts.mode === 'time') return shuffle(gen('time', 12).concat(cs.filter((c) => c.t === 'orari' && c.type !== 'w').slice(0, 6).map((c) => ({ card: c, practice: true }))));
  if (opts.mode === 'num') return gen('num', 14);
  if (opts.mode === 'speak') {
    const sp = cs.filter((c) => c.type === 'qa' || c.type === 'say');
    const words = cs.filter((c) => c.type === 'w' && !isNew(c));
    return shuffle(shuffle(sp).slice(0, 14).concat(shuffle(words).slice(0, 6)).map((c) => ({ card: c, practice: !(isNew(c) || c.s.due <= t), forceMode: c.type === 'w' ? 'speak' : null })));
  }
  if (opts.mode === 'weak') {
    const seen = cs.filter((c) => !isNew(c)).sort((a, b) => (b.s.l - a.s.l) || (a.s.ef - b.s.ef) || (a.s.ok / a.s.seen - b.s.ok / b.s.seen));
    return shuffle(seen.slice(0, 20)).map((c) => ({ card: c, practice: c.s.due > t }));
  }
  const pool = opts.topic ? cs.filter((c) => c.t === opts.topic) : cs;
  const due = shuffle(pool.filter((c) => !isNew(c) && c.s.due <= t));
  let fresh = pool.filter(isNew);
  const allowance = opts.extraNew || (opts.topic ? 25 : Math.max(0, S.settings.newPerDay - dayStat().nw));
  // misz-masz: nowe karty rotacyjnie z tematów, zaczynając od najnowszej lekcji
  const byTopic = {}; fresh.forEach((c) => (byTopic[c.t] = byTopic[c.t] || []).push(c));
  const tOrder = S.order.slice().reverse().filter((id) => byTopic[id]);
  fresh = []; let i = 0;
  while (fresh.length < allowance && tOrder.some((id) => byTopic[id].length)) { const id = tOrder[i++ % tOrder.length]; if (byTopic[id].length) fresh.push(byTopic[id].shift()); }
  let di = 0, ni = 0;
  while (di < due.length || ni < fresh.length) {
    if (di < due.length) items.push({ card: due[di++] }); if (di < due.length) items.push({ card: due[di++] });
    if (ni < fresh.length) items.push({ card: fresh[ni++] });
  }
  if (opts.topic && items.length < 10) items = items.concat(shuffle(pool.filter((c) => !items.some((x) => x.card === c))).slice(0, 12 - items.length).map((c) => ({ card: c, practice: true })));
  if (!opts.topic) {
    const gens = [S.settings.genTime && 'time', S.settings.genNum && 'num'].filter(Boolean);
    if (gens.length) { const out = []; items.forEach((it, k) => { out.push(it); if (k % 6 === 5) out.push({ gen: gens[(k / 6 | 0) % gens.length] }); }); if (items.length < 6) out.push({ gen: gens[0] }); items = out; }
  }
  return items;
}
function practiceQueue() {
  const t = today(); const cs = allCards().filter((c) => active(c) && !isNew(c));
  const w = cs.map((c) => ({ c, k: Math.random() * (1 + c.s.l * 2 + (3 - c.s.ef)) })).sort((a, b) => b.k - a.k).slice(0, 15).map((x) => ({ card: x.c, practice: x.c.s.due > t }));
  const gens = [S.settings.genTime && 'time', S.settings.genNum && 'num'].filter(Boolean);

}

function distractors(c, field, n) {

  const other = shuffle(pool.filter((x) => x.t !== c.t)).map((x) => x[field]);
  const out = []; for (const v of same.concat(other)) { if (v && v !== c[field] && !out.includes(v)) out.push(v); if (out.length >= n) break; }
  return out;
}

function clockSVG(h, m) {
  const a = (m / 60) * 360, b = ((h % 12) / 12) * 360 + (m / 60) * 30, R = 70;
  const hand = (deg, len, w, col) => { const r = (deg - 90) * Math.PI / 180; return `<line x1="80" y1="80" x2="${80 + Math.cos(r) * len}" y2="${80 + Math.sin(r) * len}" stroke="${col}" stroke-width="${w}" stroke-linecap="round"/>`; };
  let ticks = ''; for (let i = 0; i < 12; i++) { const r = (i * 30 - 90) * Math.PI / 180; ticks += `<line x1="${80 + Math.cos(r) * 60}" y1="${80 + Math.sin(r) * 60}" x2="${80 + Math.cos(r) * 66}" y2="${80 + Math.sin(r) * 66}" stroke="var(--muted)" stroke-width="${i % 3 ? 2 : 4}"/>`; }
  return `<svg class="clock" width="160" height="160" viewBox="0 0 160 160"><circle cx="80" cy="80" r="${R}" fill="var(--card)" stroke="var(--line)" stroke-width="5"/>${ticks}
  ${hand(b, 38, 6, 'var(--ink)')}${hand(a, 56, 4, 'var(--accent)')}<circle cx="80" cy="80" r="5" fill="var(--ink)"/></svg>`;
}
function randTime() {

}

function randNum() {

  if (lvl === 1) return Math.floor(Math.random() * 21);
  if (lvl === 2) return r < 0.3 ? Math.floor(Math.random() * 21) : 21 + Math.floor(Math.random() * 80);
  if (lvl === 3) return r < 0.5 ? 21 + Math.floor(Math.random() * 80) : 100 + Math.floor(Math.random() * 900);
  return r < 0.4 ? 100 + Math.floor(Math.random() * 900) : r < 0.8 ? 1900 + Math.floor(Math.random() * 131) : 1000 + Math.floor(Math.random() * 9000);
}

function md(s) {
  const lines = String(s).split('\n'); let out = '', ul = false;
  const inl = (t) => esc(t).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
  for (const l of lines) {
    if (/^\s*-\s+/.test(l)) { if (!ul) { out += '<ul>'; ul = true; } out += `<li>${inl(l.replace(/^\s*-\s+/, ''))}</li>`; continue; }
    if (ul) { out += '</ul>'; ul = false; }
    if (/^##\s+/.test(l)) out += `<h2>${inl(l.replace(/^##\s+/, ''))}</h2>`; else if (l.trim()) out += `<p>${inl(l)}</p>`;
  }
  return out + (ul ? '</ul>' : '');
}

function parseQuick(txt) {
  const out = [];
  txt.split('\n').map((l) => l.trim()).filter(Boolean).forEach((l) => {
    let kind = 'w'; if (l.startsWith('?')) { kind = 'qa'; l = l.slice(1).trim(); } else if (l.startsWith('!')) { kind = 'say'; l = l.slice(1).trim(); }
    let parts = l.split(/\s*=\s*|\t+|\s+[-–—]\s+/); if (parts.length < 2) { if (kind === 'say') parts = [l, '']; else return; }
    const left = parts[0].trim(), right = parts.slice(1).join(' = ').trim();
    if (kind === 'qa') { const fw = norm(right).split(' ').filter((w) => w.length > 2); out.push({ type: 'qa', q: left, pl: '', m: right, keys: fw.length ? [fw[0]] : [] }); }
    else if (kind === 'say') out.push({ type: 'say', it: left, pl: right });
    else if (/_{2,}/.test(left)) out.push({ type: 'c', c: left, a: right });
    else out.push({ type: 'w', it: left, pl: right });
  });
  return out;
}
